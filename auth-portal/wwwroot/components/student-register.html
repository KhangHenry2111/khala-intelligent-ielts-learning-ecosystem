<form class="auth-form register-form" data-usertype="Student" data-form="register">
  <h2>Student Registration</h2>
  <p class="form-hint">Create your student account to start learning.</p>
  <label>Full name<input name="fullName" autocomplete="name" /></label>
  <label>Email<input name="email" type="email" autocomplete="email" required /></label>
  <label>Username<input name="username" autocomplete="username" required /></label>
  <label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" required /></label>
  <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required /></label>
  <button type="submit">Create Student Account</button>
  <button type="button" class="text-button" data-action="login">Already have an account? Sign in</button>
</form>
