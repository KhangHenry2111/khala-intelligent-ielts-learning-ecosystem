<form class="auth-form login-form" data-usertype="Student">
  <div class="form-kicker">IELTS Study Assistant</div>
  <h2>Welcome back</h2>
  <p class="form-hint">Sign in to continue your IELTS learning journey.</p>
  <label>Username<input name="username" autocomplete="username" placeholder="Enter your username" required /></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required /></label>
  <button type="submit">Sign in as Student <span aria-hidden="true">→</span></button>
  <div class="auth-switch">
    <span>Don't have an account?</span>
    <button type="button" class="register-button" data-action="register">Register as Student</button>
  </div>
</form>
